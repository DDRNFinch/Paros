<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Paros">
  <title>Paros</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./paros-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./paros-180.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="screen" id="screen" aria-label="Paros home">
    <button class="back-button" id="backButton" type="button">Back</button>
    <button class="menu-button" id="menuButton" type="button" aria-label="Open Paros menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <div class="assistant-stage" id="parosStage" role="button" tabindex="0" aria-label="Paros">
      <div class="assistant-float">
        <div class="assistant-character" id="paros" aria-hidden="true">
          <div class="assistant-body">
            <div class="eyes"><span class="eye"></span><span class="eye"></span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="assistant-speech" id="parosSpeech" aria-live="polite"></div>
    <div class="context-title" id="contextTitle"></div>
    <div class="pill-stack" id="pillStack" aria-label="Paros options"></div>

    <div class="bottom-arches" id="bottomArches" aria-label="Paros shortcuts">
      <button class="status-arch" type="button" data-open="learners"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38"></circle></svg><strong id="learnerCount">0</strong><span>Learners</span></button>
      <button class="status-arch" type="button" data-open="classes"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38"></circle></svg><strong id="classCount">0</strong><span>Classes</span></button>
      <button class="centre-mark" id="centreMark" type="button" aria-label="Open Paros"><span class="centre-eye"></span><span class="centre-eye"></span></button>
      <button class="status-arch" type="button" data-open="register"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38"></circle></svg><strong id="todayRegisterCount">0</strong><span>Register</span></button>
      <button class="status-arch" type="button" data-open="plans"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38"></circle></svg><strong id="focusCount">0</strong><span>Plans</span></button>
    </div>

    <div class="tools-menu" id="toolsMenu" aria-hidden="true">
      <button type="button" data-open="learners">Learners</button>
      <button type="button" data-open="classes">Classes</button>
      <button type="button" data-open="register">Registers</button>
      <button type="button" data-open="assessments">Assessments</button>
      <button type="button" data-open="plans">ILP & live focus</button>
      <button type="button" data-open="planning">Teaching plans</button>
      <button type="button" data-open="resources">Resources</button>
      <button type="button" data-open="settings">Settings</button>
    </div>

    <section class="overlay-panel" id="overlayPanel" aria-hidden="true">
      <div class="overlay-card">
        <header class="overlay-header">
          <div><div class="overlay-kicker" id="overlayKicker">PAROS</div><h1 id="overlayTitle"></h1><p id="overlaySubtitle"></p></div>
          <button class="round-close" id="overlayClose" type="button" aria-label="Close">×</button>
        </header>
        <div class="overlay-content" id="overlayContent"></div>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="./app.js"></script>
</body>
</html>
